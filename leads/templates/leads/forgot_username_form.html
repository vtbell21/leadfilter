{% extends "leads/base.html" %}
{% block content %}
<div class="container mt-5">
    <h2>Forgot your username?</h2>
    <p>Enter your email address below and we'll send you a link to reset your username.</p>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" name="email" required>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Send Username Reset Link</button>
    </form>
</div>
{% endblock %}
