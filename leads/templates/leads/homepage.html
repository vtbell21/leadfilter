<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Leads Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hero-section {
            padding: 100px 0;
            text-align: center;
            background-color: #f8f9fa;
        }
        .cta-buttons {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="hero-section">
        <div class="container">
            <h1>Facebook Leads Dashboard</h1>
            <p class="lead">Manage and filter your Facebook leads with AI-powered spam detection</p>
            
            <div class="cta-buttons">
                {% if user.is_authenticated %}
                    <a href="{% url 'leads:dashboard' %}" class="btn btn-primary btn-lg">Go to Dashboard</a>
                    <a href="{% url 'leads:logout' %}" class="btn btn-outline-secondary btn-lg">Logout</a>
                {% else %}
                    <a href="{% url 'leads:login' %}" class="btn btn-primary btn-lg">Login</a>
                    <a href="{% url 'leads:signup' %}" class="btn btn-outline-primary btn-lg">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
