{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0">Page Connection Conflict</h4>
                </div>
                <div class="card-body">
                    <div class="alert alert-warning">
                        <h5>The page "{{ page_name }}" is already connected to another account ({{ current_owner }}).</h5>
                        <p>Please choose how you would like to proceed:</p>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'leads:dashboard' %}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Back to Dashboard
                        </a>
                        
                        <form method="post" action="{% url 'leads:save_facebook_page' %}" class="d-inline">
                            {% csrf_token %}
                            <input type="hidden" name="page_id" value="{{ request.session.pending_page_connection.page_id }}">
                            <input type="hidden" name="page_name" value="{{ request.session.pending_page_connection.page_name }}">
                            <input type="hidden" name="page_access_token" value="{{ request.session.pending_page_connection.page_access_token }}">
                            <input type="hidden" name="force_reassign" value="true">
                            <button type="submit" class="btn btn-danger">
                                <i class="fas fa-exchange-alt"></i> Reassign Page to My Account
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
