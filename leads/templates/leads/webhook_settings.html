{% extends "leads/base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h2 class="mb-4">Webhook Settings</h2>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_webhook_url" class="form-label">Webhook URL</label>
                            {{ form.webhook_url }}
                        </div>
                        <div class="form-check mb-2">
                            {{ form.send_non_spam }}
                            <label class="form-check-label" for="id_send_non_spam">Send non-spam leads</label>
                        </div>
                        <div class="form-check mb-4">
                            {{ form.send_spam }}
                            <label class="form-check-label" for="id_send_spam">Send spam leads</label>
                        </div>
                        <button type="submit" class="btn btn-primary">Save Settings</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
