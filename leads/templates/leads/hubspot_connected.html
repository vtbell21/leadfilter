{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="card">
                <div class="card-body">
                    <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                    <h2 class="mt-3">Successfully Connected to HubSpot!</h2>
                    <p class="text-muted mb-4">
                        Your leads will now automatically sync with your HubSpot CRM.
                    </p>
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'leads:integrations' %}" class="btn btn-primary">
                            <i class="bi bi-gear"></i> Manage Integrations
                        </a>
                        <a href="{% url 'leads:dashboard' %}" class="btn btn-outline-secondary">
                            <i class="bi bi-speedometer2"></i> Go to Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .card {
        border: none;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease;
    }
    .card:hover {
        box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
    }
    .text-success {
        color: #198754 !important;
    }
    .btn {
        padding: 0.5rem 1.5rem;
    }
    .btn i {
        margin-right: 0.5rem;
    }
</style>
{% endblock %}
